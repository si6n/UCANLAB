# gitleaks configuration — UCANLAB
#
# This file exists for exactly one reason: to record an ACCEPTED, HISTORICAL
# leak that cannot be removed without rewriting published git history.
#
# ---------------------------------------------------------------------------
# The finding
# ---------------------------------------------------------------------------
# A hardcoded Obsidian Local REST API key was committed as the *default* value
# of `OBSIDIAN_API_KEY` in three files:
#
#   .clinerules                (Cline agent rules)
#   .orca.md                   (Orca worktree notes)
#   scripts/obsidian_api.py    (Obsidian REST client)
#
# All three arrived via automated "untracked files on cline checkpoint"
# commits (earliest: 1ab45b9, 2026-09-17). gitleaks reports 45 findings
# because it re-reads the same key across 15 historical commits.
#
# ---------------------------------------------------------------------------
# Current state
# ---------------------------------------------------------------------------
#   * .clinerules and .orca.md  — DELETED, no longer tracked or on disk.
#   * scripts/obsidian_api.py   — DELETED in the commit that adds this file.
#                                 The Obsidian integration was removed.
#   * The key value appears in NO file at HEAD.
#
# ---------------------------------------------------------------------------
# Why an allowlist rather than a history rewrite
# ---------------------------------------------------------------------------
# Removing the commit history requires `git filter-repo` plus a force-push.
# That rewrites every downstream clone and every open branch, and it cannot be
# undone. The owner opted to ROTATE the key instead, which makes the exposed
# historical value worthless.
#
# ACCEPTED RISK — OWNER ACTION REQUIRED:
#   The operator must rotate the Obsidian API key. Until that rotation is
#   confirmed, this allowlist suppresses a LIVE credential. Rotating the key
#   is the actual remediation; this file only stops the scanner from blocking
#   every unrelated pull request.
#
# Review by: 2027-01-01 — if the rotation is confirmed, delete this
# allowlist and let gitleaks guard the tree again.
#
# ---------------------------------------------------------------------------
# Scope discipline
# ---------------------------------------------------------------------------
# The allowlist is limited to the three exact historical paths, by regex
# anchored to the repository root. It does NOT disable the generic-api-key
# rule, and it does NOT exempt any other file. Any NEW secret anywhere in the
# tree still fails the gate.

title = "UCANLAB gitleaks configuration"

[extend]
# Keep the full upstream default ruleset active (generic-api-key, cloud
# provider keys, private keys, etc.). This config only ADDS an allowlist.
useDefault = true

[[allowlists]]
description = "Accepted historical Obsidian API key leak; key rotated by owner. Files deleted at HEAD."
# Match the three historical paths only. Anchored so a new file with a
# similar name elsewhere cannot hide behind this rule.
paths = [
  '''(^|/)\.clinerules$''',
  '''(^|/)\.orca\.md$''',
  '''^scripts/obsidian_api\.py$''',
]
# Restrict the exemption to this one rule ID so other detectors stay armed.
regexTarget = "match"
# Also require the line to be the known Obsidian default-key pattern, so a
# different (real, new) secret in one of these paths is still reported.
# (These paths are deleted; this is belt-and-braces for history scans.)
regexes = [
  '''OBSIDIAN_API_KEY''',
]
