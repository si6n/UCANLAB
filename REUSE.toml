[[annotations]]
path = ["src/**", "scripts/**", "tests/**", "pyproject.toml", "README.md", "conftest.py"]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 Universal CAN-Bus Diagnostic Platform Authors"
SPDX-License-Identifier = "MIT"

